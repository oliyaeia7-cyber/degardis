<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود مدیر — دگردیس</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand" style="text-decoration:none;"><span class="mark">د</span> دگردیس<span class="brand-sub">پنل مدیریت</span></a>
  </div>
</header>

<section class="section" style="padding-top:70px;">
  <div class="wrap" style="max-width:420px;">
    <span class="eyebrow">ADMIN ACCESS</span>
    <h2 style="margin-top:10px; font-size:clamp(22px,3vw,28px); font-weight:800;">ورود به پنل مدیریت</h2>
    <p style="color:var(--muted); font-size:14px; margin-top:8px; margin-bottom:28px;">
      رمز عبور از متغیر محیطی <code style="font-family:var(--font-mono); direction:ltr; display:inline-block;">ADMIN_PASSWORD</code> در Render خوانده می‌شود.
    </p>

    {% if error %}
    <div style="background:rgba(178,58,46,0.15); border:1px solid var(--red); color:#f0c9c4; border-radius:6px; padding:12px 16px; font-size:13.5px; margin-bottom:20px;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="specimen" style="grid-template-columns:1fr; gap:14px; display:grid;">
      <div>
        <label for="password" style="display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;">رمز عبور</label>
        <input
          type="password" id="password" name="password" required autofocus
          style="width:100%; padding:12px 14px; border-radius:4px; border:1px solid var(--line-paper); background:var(--paper-dim); color:var(--ink); font-family:var(--font-mono); font-size:15px; direction:ltr;"
        >
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center; width:100%;">ورود →</button>
    </form>

    <p style="margin-top:24px;"><a href="/" style="color:var(--muted); font-size:13px; text-decoration:none; border-bottom:1px dotted var(--line);">← بازگشت به سایت</a></p>
  </div>
</section>

</body>
</html>
